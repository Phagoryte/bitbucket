name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'security/**'
  merge_group:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Build / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Unit tests can run without external Bitbucket credentials.
      # Integration tests are explicitly disabled in this public CI gate.
      BITBUCKET_CLOUD_URL: https://api.bitbucket.org/2.0
      BITBUCKET_CLOUD_USERNAME: ci@example.invalid
      BITBUCKET_CLOUD_API_TOKEN: ci-placeholder-token
      BITBUCKET_SERVER_URL: https://bitbucket.example.invalid/rest
      BITBUCKET_SERVER_TOKEN: ci-placeholder-token
      BITBUCKET_SERVER_TEST_PROJECT_KEY: CI
      BITBUCKET_SERVER_TEST_PROJECT_NAME: CI
      SKIP_BITBUCKET_CLOUD: true
      SKIP_BITBUCKET_SERVER: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
